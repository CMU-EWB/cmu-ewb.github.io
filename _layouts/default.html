<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Apply the saved (or system) color theme before the page draws, so it never flashes.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign s = site.data.settings %}
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ s.chapter_name }} | {{ s.school }}</title>
  <meta name="description" content="{{ page.description | default: s.tagline | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <meta property="og:image" content="{{ '/assets/img/logo-square.png' | absolute_url }}">
</head>
<body>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
