---
layout: default
---
<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow"><a href="{{ '/projects/' | relative_url }}">← All projects</a></p>
    <h1>{{ page.title }}</h1>
    <p class="meta-row">
      {% if page.location %}<span>📍 {{ page.location }}</span>{% endif %}
      {% if page.status %}<span class="pill pill-{{ page.status | slugify }}">{{ page.status }}</span>{% endif %}
    </p>
  </div>
</section>
<section class="wrap page-body">
  {% if page.image and page.image != "" %}<img class="feature-img" src="{{ page.image | relative_url }}" alt="{{ page.title }}">{% endif %}
  <div class="prose">{{ content }}</div>
</section>
