{% assign s = site.data.settings %}
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="logo-light" src="{{ '/assets/img/logo-horizontal.png' | relative_url }}" alt="{{ s.chapter_name }} | {{ s.school }}" width="234" height="50">
      <img class="logo-dark" src="{{ '/assets/img/logo-horizontal-white.png' | relative_url }}" alt="{{ s.chapter_name }} | {{ s.school }}" width="234" height="50">
    </a>
    <nav id="site-nav" class="site-nav">
      {% for item in site.nav %}
        {% assign active = false %}
        {% if item.url == "/" %}{% if page.url == "/" %}{% assign active = true %}{% endif %}
        {% elsif page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}" {% if active %}aria-current="page"{% endif %} {% if item.title == "Join" %}class="nav-cta"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
