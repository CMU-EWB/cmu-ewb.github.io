hero_title: "Engineering that serves communities."
hero_text: "We're a student chapter of Engineers Without Borders. We design and build sustainable projects with partner communities, and we learn real engineering along the way. Every major is welcome."
hero_image: ""
highlights:
  - title: "Build real projects"
    text: "Work on water, energy and infrastructure projects with partner communities, from first survey to final build."
  - title: "Grow as an engineer"
    text: "Get hands-on design, project management and technical writing experience that classes can't give you."
  - title: "Join a community"
    text: "Meet students from every major, travel to conferences, and make an impact together."
